- name: MAJ Cache Paquets APT
  ansible.builtin.apt:
    update_cache: yes

- name: Installation des paquets
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-debian
      - python3-requests
      - python3-docker
    state: present

- name: Création Dossier Clés de sécurité APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Téléchargement clé GPG officielle dépôt Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Ajout Dépôt Docker au format moderne DEB822
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: MAJ Cache APT suite à l'ajout du dépôt Docker
  ansible.builtin.apt:
    update_cache: yes

- name: Installation du moteur Docker avec ses plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Activation et Démarrage du service Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes

- name: Téléchargement Image Docker Nginx
  community.docker.docker_image:
    name: nginx
    tag: latest
    source: pull

- name: Création et Démarrage du conteneur Nginx
  community.docker.docker_container:
    name: mon_nginx_ia
    image: nginx:latest
    state: started
    restart_policy: always
    ports:
      - "80:80"
    env:
      TZ: "Europe/Paris"
      NGINX_HOST: "localhost"

- name: Vérification Statut Conteneur Nginx
  community.docker.docker_container_info:
    name: mon_nginx_ia
  register: result_container
  failed_when: "not result_container.exists or not result_container.container.State.Running"